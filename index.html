<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Oroboro - Hedwig</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
  #app{width:600px;height:600px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
  h1{font-size:24px;font-weight:900}
  #stage{width:320px;height:320px;background:#111;border:2px solid #fff;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative}
  #pig{font-size:120px;animation:puff 1.2s infinite ease-in-out;transform-origin:center}
  @keyframes puff{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.25)}
  }
  #puffs{position:absolute;top:20px;left:0;width:100%;height:100%;pointer-events:none}
 .bubble{position:absolute;font-size:20px;animation:float 1.2s infinite}
  @keyframes float{0%{transform:translateY(0) scale(0);opacity:0}50%{opacity:1}100%{transform:translateY(-60px) scale(1.2);opacity:0}}
 .card{width:100%;height:64px;background:#fff;color:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
 .footer{margin-top:auto;font-size:12px;opacity:.5}
</style>
</head>
<body>
<div id="app">
  <h1>HEDWIG</h1>
  <div id="stage">
    <div id="pig">🐹</div>
    <div id="puffs"></div>
  </div>
  <div class="card" id="action">puff puff • ENTER</div>
  <div class="footer">Oroboro • 600x600 • pure black</div>
</div>
<script>
  const pig=document.getElementById('pig');
  const puffs=document.getElementById('puffs');
  const action=document.getElementById('action');
  let puffing=true;
  function addBubble(){
    if(!puffing) return;
    const b=document.createElement('div');
    b.className='bubble';
    b.textContent=Math.random()>0.5?'💨':'✨';
    b.style.left=(Math.random()*80+10)+'%';
    b.style.top=(Math.random()*30+40)+'%';
    puffs.appendChild(b);
    setTimeout(()=>b.remove(),1200);
  }
  setInterval(addBubble,200);
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      puffing=!puffing;
      pig.style.animationPlayState=puffing?'running':'paused';
      action.textContent=puffing?'puff puff • ENTER':'paused • ENTER';
      pig.textContent=puffing?'🐹':'😤';
    }
  });
  action.addEventListener('click',()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'})));
</script>
</body>
</html>
