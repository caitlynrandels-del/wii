<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Oroboro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
  #app{width:600px;height:600px;padding:24px;display:flex;flex-direction:column;gap:14px}
 .top{display:flex;justify-content:space-between;align-items:center}
  h1{font-size:26px;font-weight:900;letter-spacing:-0.5px}
  #clock{font-size:16px;opacity:.7}
 .card{width:100%;height:92px;background:#111;border:2px solid #fff;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:20px;font-weight:600}
 .card.focused{background:#fff;color:#000}
 .card span{font-size:14px;opacity:.7}
 .card.focused span{opacity:1}
 .footer{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;opacity:.5}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1>OROBORO</h1><div id="clock">--:--</div></div>
  <div class="card focused" data-a="dash">01 Dashboard <span>ENTER</span></div>
  <div class="card" data-a="widgets">02 Widgets <span>•</span></div>
  <div class="card" data-a="sys">03 System <span>•</span></div>
  <div class="footer"><span>600x600 • pure black</span><span>D-PAD + ENTER</span></div>
</div>
<script>
  const cards=[...document.querySelectorAll('.card')];
  let i=0;
  const clockEl=document.getElementById('clock');
  const tick=()=>{const d=new Date();clockEl.textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
  tick(); setInterval(tick,10000);
  const update=()=>cards.forEach((c,k)=>c.classList.toggle('focused',k===i));
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){i=Math.min(i+1,cards.length-1);update();}
    if(e.key==='ArrowUp'){i=Math.max(i-1,0);update();}
    if(e.key==='Enter'){
      const a=cards[i].dataset.a;
      if(a==='dash'){cards[i].innerHTML='Live • '+new Date().toLocaleTimeString();}
      if(a==='widgets'){cards[i].innerHTML='Widgets Ready • Add yours';}
      if(a==='sys'){cards[i].innerHTML='Battery • Connected ✓';}
      setTimeout(()=>{cards[i].innerHTML=cards[i].dataset.a==='dash'?'01 Dashboard <span>ENTER</span>':cards[i].dataset.a==='widgets'?'02 Widgets <span>•</span>':'03 System <span>•</span>';},1200);
    }
    e.preventDefault();
  });
  cards.forEach((c,k)=>c.addEventListener('click',()=>{i=k;update();document.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));}));
</script>
</body>
</html>
